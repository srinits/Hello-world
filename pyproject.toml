 [build-system]
 requires = ["setuptools>=68", "wheel"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "travel-agent"
 version = "0.1.0"
 description = "Sample AI agent for planning and booking travel itineraries."
 readme = "README.md"
 requires-python = ">=3.9"
 authors = [
   { name = "AI Generated" }
 ]
 classifiers = [
   "Programming Language :: Python :: 3",
   "License :: OSI Approved :: MIT License",
   "Operating System :: OS Independent",
 ]

 [project.optional-dependencies]
 dev = []
